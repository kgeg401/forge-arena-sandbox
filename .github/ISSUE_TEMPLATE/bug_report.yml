name: Setup, launcher or interface problem
description: Installation, compatibility, updates, menus, artwork or saved data.
title: "[Client] "
labels: [bug, needs-triage, "area:client"]
body:
  - type: input
    id: version
    attributes:
      label: Sandbox version
      placeholder: "Beta 1 / 0.2.0-beta.1 (or your exact older version)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Installation or Arena compatibility check
        - Launcher or automatic update
        - Home or Options
        - Decks or search
        - Packs
        - Artwork or card preview
        - Saved deck or collection data
        - A game prompt or controls
    validations:
      required: true
  - type: input
    id: arena
    attributes:
      label: Arena build and Windows version
      description: Include Steam or standalone, the Check Arena build/error, and Windows version. Unknown if unavailable.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the deck/card names when relevant and the last action before the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or relevant log excerpt
      description: Attach a screenshot or reviewed short excerpt. Do not post credentials, room invitations, game files, full installations or unreviewed match exports.
